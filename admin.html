<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Shop Kinshasa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
    <header style="background: rgba(255,255,255,0.2);">
        <nav style="max-width: 1200px; margin: 0 auto;">
            <h1><i class="fas fa-crown"></i> Admin Dashboard</h1>
            <a href="index.html" style="text-decoration: none;">
                <button>← Retour Shop</button>
            </a>
        </nav>
    </header>
    
    <div class="container" style="padding: 2rem;">
        <h2><i class="fas fa-plus-circle"></i> Ajouter Produit</h2>
        <form id="adminForm" style="background: rgba(255,255,255,0.9); padding: 2rem; border-radius: 20px; margin-bottom: 2rem;">
            <input type="text" id="prodName" placeholder="Nom du produit (ex: iPhone 14)" required>
            <input type="number" id="prodPrice" placeholder="Prix en FC (ex: 850000)" step="1000" required>
            <input type="url" id="prodImage" placeholder="URL image ou https://via.placeholder.com/400x300/FF6B6B/FFF?text=NOM">
            <textarea id="prodDesc" placeholder="Description du produit"></textarea>
            <button type="submit">✅ AJOUTER PRODUIT</button>
        </form>
        
        <h2><i class="fas fa-list"></i> Vos Produits</h2>
        <div id="adminProducts" class="product-grid"></div>
    </div>

    <script>
        // Même code products que script.js
        let products = JSON.parse(localStorage.getItem('products')) || [
            { id: 1, name: 'iPhone 14 Pro', price: 850000, image: 'https://via.placeholder.com/400x300/333/fff?text=iPhone14', desc: '128Go, état neuf' }
        ];

        document.getElementById('adminForm').onsubmit = function(e) {
            e.preventDefault();
            const newProduct = {
                id: Date.now(),
                name: document.getElementById('prodName').value,
                price: parseInt(document.getElementById('prodPrice').value),
                image: document.getElementById('prodImage').value,
                desc: document.getElementById('prodDesc').value
            };
            products.unshift(newProduct);
            localStorage.setItem('products', JSON.stringify(products));
            displayAdminProducts();
            this.reset();
            alert('✅ Produit ajouté ! Rafraîchissez le shop pour voir.');
        };

        function displayAdminProducts() {
            document.getElementById('adminProducts').innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}">
                    <h3>${p.name} - ${p.price.toLocaleString()} FC</h3>
                    <p>${p.desc}</p>
                    <button onclick="deleteProduct(${p.id})" style="background: #dc3545;">🗑️ Supprimer</button>
                </div>
            `).join('');
        }

        function deleteProduct(id) {
            if (confirm('Supprimer ce produit ?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('products', JSON.stringify(products));
                displayAdminProducts();
            }
        }

        displayAdminProducts();
    </script>
</body>
</html>
