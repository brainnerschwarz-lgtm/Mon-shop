<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - MonShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-panel">
    <header style="background: rgba(0,0,0,0.2);">
        <nav style="max-width: 1200px; margin: 0 auto;">
            <h1><i class="fas fa-crown"></i> Panneau Admin</h1>
            <a href="index.html"><button>Retour Shop</button></a>
        </nav>
    </header>
    <main>
        <h2><i class="fas fa-plus"></i> Ajouter un Produit</h2>
        <form id="addProductForm" class="admin-form">
            <input type="text" id="prodName" placeholder="Nom du produit" required>
            <input type="number" id="prodPrice" placeholder="Prix (€)" step="0.01" required>
            <input type="url" id="prodImage" placeholder="URL image (ex: https://via.placeholder.com/300)" required>
            <textarea id="prodDesc" placeholder="Description"></textarea>
            <button type="submit" id="addProductBtn"><i class="fas fa-save"></i> Ajouter</button>
        </form>

        <h2><i class="fas fa-list"></i> Produits (CRUD)</h2>
        <div id="adminProducts" class="admin-grid"></div>
    </main>
    <script src="script.js"></script>
    <script>
        // Auto-charger admin si admin connecté (simulé)
        if (!localStorage.getItem('isAdmin')) {
            alert('Accès admin réservé. Définissez localStorage.setItem("isAdmin", true) dans console pour tester.');
            window.location.href = 'index.html';
        }
        displayAdminProducts();
    </script>
</body>
</html>
