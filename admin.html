<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-panel">
    <header>
        <nav>
            <h1><i class="fas fa-crown"></i> Admin Dashboard</h1>
            <div>
                <button onclick="localStorage.removeItem('isAdmin'); window.location.href='index.html';">Sortir Admin</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="admin-form">
            <h2><i class="fas fa-plus-circle"></i> Nouveau Produit</h2>
            <form id="addProductForm">
                <input type="text" id="prodName" placeholder="Nom produit">
                <input type="number" id="prodPrice" placeholder="Prix €" step="0.01">
                <input type="url" id="prodImage" placeholder="URL image">
                <textarea id="prodDesc" placeholder="Description"></textarea>
                <button type="submit"><i class="fas fa-save"></i> Ajouter Produit</button>
            </form>
        </div>
        <h2 style="text-align:center; margin: 2rem;"><i class="fas fa-list"></i> Liste Produits</h2>
        <div id="adminProducts" class="admin-grid"></div>
    </main>
    <script src="script.js"></script>
    <script>
        if (localStorage.getItem('isAdmin') !== 'true') window.location.href = 'index.html';
        document.getElementById('addProductForm').onsubmit = addProduct;
        loadData(); // Charge et affiche
    </script>
</body>
</html>
