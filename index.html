<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Shop Kinshasa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <h1><i class="fas fa-store"></i> Shop Kinshasa</h1>
            <div id="auth-section">
                <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Connexion</button>
                <button id="registerBtn"><i class="fas fa-user-plus"></i> Inscription</button>
                <span id="userWelcome"></span>
                <button id="logoutBtn" style="display:none;"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
                <button id="adminBtn" style="display:none; background: linear-gradient(45deg, #ff6b6b, #ee5a52) !important;">
                    <i class="fas fa-user-shield"></i> Admin
                </button>
            </div>
        </nav>
    </header>

    <!-- Modal Connexion -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-sign-in-alt"></i> Connexion</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPass" placeholder="Mot de passe" required>
                <button type="submit">Se connecter</button>
            </form>
        </div>
    </div>

    <!-- Modal Inscription -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-user-plus"></i> Inscription</h2>
            <form id="registerForm">
                <input type="text" id="regName" placeholder="Nom complet" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPass" placeholder="Mot de passe" required>
                <button type="submit">S'inscrire</button>
            </form>
        </div>
    </div>

    <!-- Modal Panier -->
    <section id="cartSection" class="section hidden">
        <h2><i class="fas fa-shopping-cart"></i> Mon Panier</h2>
        <div id="cartItems"></div>
        <div id="cartTotal"></div>
        <button id="checkoutBtn">Passer Commande</button>
    </section>

    <!-- Section Produits -->
    <section class="products">
        <div class="container">
            <h2><i class="fas fa-boxes"></i> Nos Produits</h2>
            <div id="productsList" class="product-grid"></div>
        </div>
    </section>

    <!-- Modal Checkout -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-credit-card"></i> Finaliser Commande</h2>
            <form id="checkoutForm">
                <input type="text" placeholder="Nom complet" required>
                <input type="text" placeholder="Adresse (Quartier, Avenue)" required>
                <input type="tel" placeholder="Numéro WhatsApp" required>
                <button type="submit">Confirmer Commande</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
